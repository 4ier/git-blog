# Dependencies
markdown:            kramdown
highlighter:         rouge
plugins:             [jekyll-paginate]

# Permalinks
permalink:           pretty

# Setup
title:               4ier's Blog
description:         '爱与自由'
baseurl:             /git-blog

author:
  name:              4ier
  email:             yang.fourier@gmail.com

paginate:            5

# Custom vars
version:             2.0.0

github:
  repo:              https://github.com/4ier/

twitter:             https://twitter.com/yangfourier

excerpt_separator:  '<!-- more -->'

# Giscus 批注系统配置
giscus:
  enabled: true
  repo: "4ier/git-blog"
  repo_id: "MDEwOlJlcG9zaXRvcnkxNDM1ODM4NTA="
  category: "Announcements"
  category_id: "DIC_kwDOCI7qas4C08qd"
  mapping: "pathname"
  reactions_enabled: true
  theme: "preferred_color_scheme"
  lang: "zh-CN"